[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phoneticspell"
version = "0.1.0"
description = "Fast multilingual phonetic + keyboard + frequency spellchecker using distinctive features"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
